<!-- @dsCard group="Website Manager" height=300 subtitle="New / draft / published document status" -->
<div class="hc-admin" style="padding:24px;display:grid;gap:12px">
  <div class="hc-status hc-status--draft"><div class="hc-status__head"><span class="hc-status__badge">Draft</span><p>This is not published yet. Visitors cannot see it.</p></div></div>
  <div class="hc-status hc-status--live"><div class="hc-status__head"><span class="hc-status__badge">Published</span><p>Visitors can see this. When you change something, save your changes and preview them before publishing.</p></div></div>
  <div class="hc-status hc-status--new"><div class="hc-status__head"><span class="hc-status__badge">New</span><p>Not saved yet. Click “Save Changes” to keep it. Visitors cannot see it.</p></div></div>
</div>
