<!-- @dsCard group="Booking" height=210 subtitle="Booking-bar field and guest stepper on a dark ground" -->
<div class="tone-deep" style="padding:24px 32px;max-width:420px">
  <button class="bfield" type="button"><span>Dates</span><svg aria-hidden="true" viewBox="0 0 7 4" width="7" height="4"><path d="M0 0h7L3.5 4z" fill="currentColor"/></svg></button>
  <div class="stepper">
    <div><p class="label" style="margin:0">Adults</p></div>
    <div class="ctl"><button type="button" aria-label="Adults −"><i></i></button><output>2</output><button type="button" aria-label="Adults +"><i></i><i></i></button></div>
  </div>
  <div class="stepper">
    <div><p class="label" style="margin:0">Children</p></div>
    <div class="ctl"><button type="button" aria-label="Children −" disabled><i></i></button><output>0</output><button type="button" aria-label="Children +"><i></i><i></i></button></div>
  </div>
</div>
