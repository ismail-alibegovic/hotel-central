name: Update visual baselines

# Runs when a branch named ci/update-baselines/* is pushed (or manually from the default branch).
# Regenerates tests/e2e/__screenshots__ on the same runner image CI uses, so baselines are
# rendered deterministically for CI, and commits them to the selected branch. A human MUST review the
# image diff in the PR before merging (see docs/TESTING.md) — never run this to "make a failure go away".
on:
  workflow_dispatch:
  push:
    branches: ['ci/update-baselines/**']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "^24.22.1"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:visual:update
      - name: Commit regenerated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          git diff --cached --quiet && { echo "No baseline changes"; exit 0; }
          git commit -m "test: regenerate visual baselines on CI runner"
          git push
