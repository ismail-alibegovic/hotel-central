name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "^24.22.1"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  smoke:
    name: Playwright smoke (mobile/tablet/desktop)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "^24.22.1"
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium (bounded and retried)
        run: scripts/ci/install-playwright.sh
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-smoke
          path: |
            playwright-report
            test-results
          retention-days: 7

  visual:
    name: Playwright visual regression
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "^24.22.1"
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium (bounded and retried)
        run: scripts/ci/install-playwright.sh
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-visual
          path: |
            playwright-report
            test-results
          retention-days: 7

  cms:
    name: CMS integration + end-to-end (disposable PostgreSQL)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Administrator URL of the throw-away service container above; tests create and drop their own databases.
      HC_TEST_PG_URL: postgres://postgres:ci-only-${{ github.run_id }}@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "^24.22.1"
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium (bounded and retried)
        run: scripts/ci/install-playwright.sh
      - name: Payload integration tests (Local API + REST handlers)
        run: npm run test:int
      - name: CMS end-to-end (parity vs static baselines, admin UI mobile+desktop, API, DB-outage build, secret/trace scans)
        run: npm run test:cms-e2e
      - name: Backup + restore drill (pg_dump/pg_restore into a fresh database)
        run: npm run cms:restore-drill
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cms-test-results
          path: test-results
          retention-days: 7
