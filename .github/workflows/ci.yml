name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "^24.22.1"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  smoke:
    name: Playwright smoke (mobile/tablet/desktop)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "^24.22.1"
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium (bounded and retried)
        run: scripts/ci/install-playwright.sh
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-smoke
          path: |
            playwright-report
            test-results
          retention-days: 7

  visual:
    name: Playwright visual regression
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "^24.22.1"
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium (bounded and retried)
        run: scripts/ci/install-playwright.sh
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-visual
          path: |
            playwright-report
            test-results
          retention-days: 7

  cms:
    name: CMS integration + end-to-end (disposable in-memory MongoDB)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "^24.22.1"
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium (bounded and retried)
        run: scripts/ci/install-playwright.sh
      - name: Payload integration tests (Local API + REST handlers)
        run: npm run test:int
      - name: CMS end-to-end (parity vs static baselines, admin UI mobile+desktop, API, DB-outage build, secret/trace scans)
        run: npm run test:cms-e2e
      - name: Backup + restore drill (mongodump/mongorestore into a fresh database)
        run: |
          TOOLS="$(scripts/cms/install-mongo-tools.sh "$RUNNER_TEMP/mongo-tools")"
          PATH="$TOOLS:$PATH" npm run cms:restore-drill
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cms-test-results
          path: test-results
          retention-days: 7
